# REC GUI Intra-Process Recorder Configuration
# Configuration for the C++ MCAP recording backend

# Recorder settings
recorder:
  # Output directory for MCAP files
  output_dir: "${HOME}/.rec_gui/recordings"

  # Default compression type: none, zstd
  compression: "zstd"

  # Compression level (1-22 for zstd, ignored for none)
  compression_level: 6

  # MCAP chunk size in bytes (50 MB default)
  chunk_size: 52428800

  # Maximum file size before starting new file (0 = unlimited)
  max_file_size: 0

# Topic subscription settings
subscription:
  # QoS history depth
  qos_history_depth: 100

  # QoS reliability: BEST_EFFORT or RELIABLE
  qos_reliability: "BEST_EFFORT"

  # Topic discovery interval in milliseconds
  discovery_interval_ms: 2000

# Performance settings
performance:
  # Use intra-process communication
  use_intra_process: true

  # Thread pool size for async operations
  thread_pool_size: 4

  # Buffer size for message queue (0 = unlimited)
  message_queue_size: 1000

  # Enable performance logging
  log_performance: false

# Logging
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, FATAL
  level: "INFO"

  # Log file location
  file: "${HOME}/.rec_gui/logs/mcap_recorder.log"

  # Maximum log file size in bytes (0 = unlimited)
  max_file_size: 10485760  # 10 MB

  # Number of backup log files to keep
  max_backups: 5

# Advanced settings
advanced:
  # Enable experimental features
  experimental_features: false

  # Detailed message statistics
  collect_statistics: true

  # Flush to disk interval in milliseconds (0 = flush on every message)
  flush_interval_ms: 1000
