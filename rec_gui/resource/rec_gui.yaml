# rec_gui Configuration File
# Default settings for the MCAP Recording GUI

output:
  # Default output directory for recordings
  directory: "${HOME}/.rec_gui/recordings"
  # Recordings are named <output_prefix>_<date_profile>.mcap, profiles can
  # override both. date_profile: yyyy yy MM dd HH mm ss (MM month, mm minutes)
  # or Python strftime codes (%Y-%m-%d_%H-%M-%S)
  output_prefix: "recording"
  date_profile: "yyyy-MM-dd_HH-mm"
  # Auto-create output directory if it doesn't exist
  auto_create: true
  # Put recordings into a daily sub-folder, e.g. 2026_10_16_bosch01/
  # (a profile can override it with its own daily_subfolder key)
  daily_subfolder: true

recording:
  default_profile: default
  profiles:
    bosch01:
      date_profile: yyyy-MM-dd_HH-mm
      description: Bosch01 - Lexus3 configuration
      max_cache_size: 5242880
      output_directory: /mnt/bag/
      output_prefix: lexus3_
      storage_preset: zstd_fast
      topics:
      - /lexus3/gps/nova/current_pose
      - /lexus3/gps/nova/fix 
      - /lexus3/gps/nova/imu
      - /lexus3/gps/nova/inspvax
      - /lexus3/os_center/points
      - /lexus3/os_left/points
      - /lexus3/os_right/points
      - /lexus3/zed2i/zed_node/left/image_rect_color/compressed 
      - /lexus3/vehicle_speed_kmph
      - /lexus3/vehicle_status
      - /tf
      - /tf_static
    crp_radar01:
      date_profile: yyyy-MM-dd_HH-mm
      description: CRP radar configuration
      max_cache_size: 5242880 
      storage_preset: zstd_fast
      topics:
      - /radar_front_left
      - /radar_front_right
      - /radar_front_center
      - /radar_rear_left 
      - /radar_rear_right
      - /vehicle/steering
      - /vehicle/throttle
      - /vehicle/brake
    default:  
      date_profile: yyyy-MM-dd_HH-mm
      description: Default recording profile - all topics 
      max_cache_size: 4194304
      storage_preset: zstd_fast
      topics: []
    kaposvar01:
      date_profile: yyyy-MM-dd_HH-mm-ss
      description: Kaposvar01 configuration
      max_cache_size: 7340032
      storage_preset: zstd_fast  
      topics:
      - /gps/fix
      - /imu/data_raw
      - /imu/mag
      - /os_cloud_node/points 
      - /tf
      - /tf_static
    lexus_cam_calib:
      date_profile: yyyy-MM-dd_HH-mm
      description: Lexus camera calibration setup
      max_cache_size: 9437184
      storage_preset: zstd_fast
      topics:
      - /lexus3/zed2i/zed_node/left/camera_info 
      - /lexus3/zed2i/zed_node/right/camera_info
      - /lexus3/zed2i/zed_node/left/image_rect_color
      - /lexus3/zed2i/zed_node/right/image_rect_color
      - /lexus3/zed2i/zed_node/depth/camera_info 
      - /lexus3/zed2i/zed_node/depth/depth_registered
    lexus_slam01:
      date_profile: yyyy-MM-dd_HH-mm
      description: Lexus SLAM configuration
      max_cache_size: 5242880
      storage_preset: zstd_fast
      topics: 
      - /lexus3/gps/nova/current_pose
      - /lexus3/gps/nova/odom
      - /lexus3/os_cloud_node/map
      - /lexus3/os_cloud_node/points
      - /lexus3/zed2i/zed_node/pose 
      - /lexus3/zed2i/zed_node/left/image_rect_color/compressed
      - /lexus3/zed2i/zed_node/left/camera_info
    localization:
      date_profile: yyyy-MM-dd_HH-mm
      description: General localization topics
      max_cache_size: 10485760
      storage_preset: zstd_fast  
      topics:
      - /odometry/gps
      - /odometry/imu
      - /points/lidar_front
      - /points/lidar_rear 
      - /tf
      - /tf_static
    wheeltec01:
      date_profile: yyyy-MM-dd_HH-mm
      description: Wheeltec01 configuration
      max_cache_size: 8388608
      storage_preset: zstd_fast
      topics:
      - /ackermann_cmd
      - /arm_base_position_controller/odom 
      - /battery
      - /odom
      - /scan
      - /wheeltec_joy/joy


# Topic selection (leave empty to show all available topics)
topics:
  # Include patterns (regex)
  include: []
  # Exclude patterns (regex)
  exclude: []
  # Enable/disable topic watching
  watch_enabled: true
  # Refresh interval in seconds
  refresh_interval: 2

# GUI Settings
gui:
  # Window dimensions
  window_width: 1100
  window_height: 760
  # Auto-refresh topic list
  auto_refresh_topics: true
  # Show topic message rates
  show_message_rates: true
  # Show topic message types
  show_message_types: true
  # Log file location
  log_file: "${HOME}/.rec_gui/logs/rec_gui.log"
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_level: "INFO"

# ROS 2 Node Configuration
ros2:
  # Node name
  node_name: "rec_gui"
  # QoS profile for subscriptions
  qos_history_depth: 100
  # Use intra-process communication
  use_intra_process: true

# Advanced Settings
advanced:
  # Enable experimental features
  experimental_features: false
  # Maximum concurrent recordings
  max_concurrent_recordings: 1
  # Save configuration on exit
  save_config_on_exit: true
  # Confirm before deleting recordings
  confirm_delete: true
